services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inboxpilot
      POSTGRES_PASSWORD: inboxpilot
      POSTGRES_DB: inboxpilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inboxpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file:
      - .env
    environment:
      # Overrides .env's DATABASE_URL (which points at localhost, for
      # host-side tooling like `uv run alembic`/`pytest`) so the
      # containerized app reaches Postgres via the `db` service name.
      DATABASE_URL: postgresql+psycopg://inboxpilot:inboxpilot@db:5432/inboxpilot
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
